services:
  api-proxy:
    build: .
    image: ${DOCKER_IMAGE:-cleanllm:latest}
    container_name: cleanllm
    ports:
      - "${HOST_PORT:-11515}:11515"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TARGET_API_URL: ${TARGET_API_URL:-http://host.docker.internal:11434/v1/chat/completions}
      MODELS_API_URL: ${MODELS_API_URL:-}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5242880}
      MODEL_CACHE_TTL: ${MODEL_CACHE_TTL:-60}
      CONNECTIVITY_INTERVAL_MINUTES: ${CONNECTIVITY_INTERVAL_MINUTES:-10}
      ROUTE_AFFINITY_MINUTES: ${ROUTE_AFFINITY_MINUTES:-15}
      CIRCUIT_BREAKER_FAILURES: ${CIRCUIT_BREAKER_FAILURES:-3}
      CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${CIRCUIT_BREAKER_COOLDOWN_SECONDS:-60}
      OLLAMA_MODELS_DIR: /ollama-models
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
    volumes:
      - cleanllm-data:/data
      - ${OLLAMA_MODELS_PATH:-/root/.ollama/models}:/ollama-models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  cleanllm-data:
