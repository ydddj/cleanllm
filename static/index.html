<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanLLM</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/enhancements.css"></head>
<body><main class="shell"><header><div class="brand">CleanLLM</div><div class="header-actions"><div class="status"><i></i> 服务运行中</div><button id="logout" class="logout" type="button">退出</button></div></header>
<section class="hero"><p class="eyebrow">OPENAI COMPATIBLE GATEWAY</p><h1>让模型输出<br><em>保持干净。</em></h1><p class="intro">连接 Ollama 或其他 OpenAI 兼容服务，自动移除思考过程与系统标签。</p></section>
<section class="panel"><div class="panel-head"><div><p class="step">CONFIGURATION / 01</p><h2>代理设置</h2></div><span class="endpoint">POST /v1/chat/completions</span></div>
<form id="settings-form"><label class="wide">上游 API 地址<input id="target_api_url" type="url" required></label><label>上游 API Key<input id="api_key" type="password" placeholder="可留空"><button type="button" class="reveal">显示</button></label><label>请求超时（秒）<input id="timeout_seconds" type="number" min="1" max="3600" required></label>
<label class="wide">响应清洗正则表达式<textarea id="clean_patterns" rows="8" spellcheck="false" placeholder="每行一条正则表达式；匹配内容将被删除"></textarea><small>每行一条规则，按顺序执行。可使用 <code>(?i)</code> 忽略大小写、<code>(?s)</code> 让点号匹配换行。</small></label>
<div class="actions wide"><p id="message"></p><button class="save" type="submit">保存设置 <span>→</span></button></div></form></section><footer><span>CLEANLLM · V3.0</span><span>配置保存在容器数据卷中</span></footer></main><script src="/static/app.js"></script></body></html>
