<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanLLM</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="shell"><header><div class="brand">CleanLLM</div><div class="status"><i></i> 服务运行中</div></header>
<section class="hero"><p class="eyebrow">OPENAI COMPATIBLE GATEWAY</p><h1>让模型输出<br><em>保持干净。</em></h1><p class="intro">连接 Ollama 或其他 OpenAI 兼容服务，自动移除思考过程与系统标签。</p></section>
<section class="panel"><div class="panel-head"><div><p class="step">CONFIGURATION / 01</p><h2>代理设置</h2></div><span class="endpoint">POST /v1/chat/completions</span></div>
<form id="settings-form"><label class="wide">上游 API 地址<input id="target_api_url" type="url" required></label><label>上游 API Key<input id="api_key" type="password" placeholder="可留空"><button type="button" class="reveal">显示</button></label><label>请求超时（秒）<input id="timeout_seconds" type="number" min="1" max="3600" required></label>
<fieldset class="wide"><legend>响应清洗</legend><label class="toggle"><input id="strip_channel_tags" type="checkbox"><span></span><b>移除 Channel 标签</b></label><label class="toggle"><input id="strip_think_tags" type="checkbox"><span></span><b>移除 Think 标签</b></label><label class="toggle"><input id="strip_html_tags" type="checkbox"><span></span><b>移除孤立 HTML 标签</b></label></fieldset>
<div class="actions wide"><p id="message"></p><button class="save" type="submit">保存设置 <span>→</span></button></div></form></section><footer><span>CLEANLLM · V2.0</span><span>配置保存在容器数据卷中</span></footer></main><script src="/static/app.js"></script></body></html>
